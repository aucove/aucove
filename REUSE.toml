# REUSE.toml de la raíz; gana la última tabla que coincide
version = 1
[[annotations]]
path = ['**']
SPDX-FileCopyrightText = '2026 The aucove Authors'
SPDX-License-Identifier = 'Apache-2.0'
[[annotations]]
path = ['schemas/**']                        # D-35 (k)
SPDX-FileCopyrightText = '2026 The aucove Authors'
SPDX-License-Identifier = 'Apache-2.0'
[[annotations]]
path = ['spec/**']                           # la especificación (01 §2.2; 00-marco D-51)
SPDX-FileCopyrightText = '2026 The aucove Authors'
SPDX-License-Identifier = 'CC-BY-4.0'
[[annotations]]
path = ['docs/**']                           # la documentación de usuario (01 §2.2)
SPDX-FileCopyrightText = '2026 The aucove Authors'
SPDX-License-Identifier = 'CC-BY-4.0'
[[annotations]]
path = ['skills/**']
SPDX-FileCopyrightText = '2026 The aucove Authors'
SPDX-License-Identifier = 'MIT-0'
[[annotations]]
path = ['template/l10n/**', 'template/formats/*/l10n/**']   # texto de ejemplo (11 §7.2) y sus variantes por formato
SPDX-FileCopyrightText = '2026 The aucove Authors'
SPDX-License-Identifier = 'CC0-1.0'
[[annotations]]
path = ['template/l10n/*/tex/preamble.tex', 'template/l10n/*/.github/**', 'template/l10n/*/AGENTS.md', 'template/l10n/*/CLAUDE.md', 'template/formats/*/l10n/*/tex/preamble.tex', 'template/formats/*/l10n/*/.github/**', 'template/formats/*/l10n/*/AGENTS.md', 'template/formats/*/l10n/*/CLAUDE.md']   # código (11 §7.2) y fuentes de AGENTS/CLAUDE (REQ-TRACE-57, D-35), también en las variantes
SPDX-FileCopyrightText = '2026 The aucove Authors'
SPDX-License-Identifier = 'MIT-0'
[[annotations]]
path = ['src/aucove/_data/spdx-licenses.json']   # la lista de licencias de SPDX que usa init (11 REQ-TRACE-62)
SPDX-FileCopyrightText = 'Linux Foundation and its Contributors'
SPDX-License-Identifier = 'CC0-1.0'
