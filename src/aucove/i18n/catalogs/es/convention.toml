# Regla convention (conv.* de 02-convencion §12) y regla plan-ids (03-esquemas §5).
# Área convention (D-32 f): claves convention.* y finding.<código>.* de los códigos que emiten
# ops/rules/convention.py y ops/rules/plan_ids.py. finding.E_VALIDATION_DUPLICATE_ID está en config.toml.

# -- motivos de una regla que no pudo evaluarse (unavailable) ----------------------------

[convention.reason]
no_tree = "no hay árbol que validar (PR desde un fork o sin `--tree`)"
no_roles = "no hay un `roles.yaml` válido para resolver las partes"
check_failed = "la comprobación {check} falló de forma inesperada"
plan_unreadable = "`plan.md` no se puede leer como texto UTF-8 de 5 MiB o menos"
base_plan_unreadable = "el `plan.md` de la base no se puede leer como texto UTF-8 de 5 MiB o menos"

