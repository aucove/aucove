# -- hallazgos de la regla convention ------------------------------------------------

[finding.conv.tree.missing]
message = "Falta el archivo o la carpeta obligatoria {file}."
hint = "Restáuralo desde la plantilla o desde la rama base."

[finding.conv.format.unused]
message = "Con `format: none` sobran archivos del manuscrito LaTeX."
hint = "Sobran {unused}. Bórralos en una tarea del responsable, o cambia `format` a `latex`."

[finding.conv.path.invalid-name]
message = "El segmento '{segment}' no cumple `^[A-Za-z0-9._-]+$` (ASCII, sin espacios)."
hint = "Renombra la ruta con letras ASCII, dígitos, `.`, `_` o `-`."

[finding.conv.path.case-collision]
message = "La ruta difiere solo en mayúsculas de {other}."
hint = "Deja una sola grafía: en Windows y macOS las dos rutas son el mismo archivo."

[finding.conv.path.symlink]
message = "Enlace simbólico o submódulo versionado (modo {mode})."
hint = "Reemplázalo por un archivo regular; la convención no admite enlaces ni submódulos."

[finding.conv.path.local-committed]
message = "Archivo de estado local versionado; estas rutas nunca se versionan."
hint = "Quítalo del índice con `git rm --cached` y comprueba `.gitignore`."

[finding.conv.path.nested-instructions]
message = "Archivo o carpeta de instrucciones para agentes fuera de la raíz."
hint = "Bórralo: las instrucciones para agentes solo viven en `AGENTS.md` y `CLAUDE.md` de la raíz."

[finding.conv.path.foreign-instructions]
message = "Archivo de instrucciones que la convención no gestiona."
hint = "Mueve su contenido a la sección 7 de `AGENTS.md` y bórralo."

[finding.conv.section.undeclared]
message = "La carpeta de la parte '{section}' no está declarada en `roles.yaml`."
hint = "Declara la parte en `roles.yaml` o mueve la carpeta."

[finding.conv.section.missing]
message = "La parte '{section}' de `roles.yaml` no tiene carpeta."
hint = "Crea `sections/{section}/` con {files}."

[finding.conv.section.disallowed-file]
message = "Tipo de archivo no permitido en esta ubicación de la parte; se admiten: {allowed}."
hint = "Muévelo a la subcarpeta que corresponde o conviértelo a un formato admitido."

[finding.conv.section.large]
message = "La carpeta de la parte '{section}' pesa {size}, más de 20 MiB."
hint = "Reduce las figuras o saca del repositorio los archivos grandes."

[finding.conv.file.large]
message = "El archivo pesa {size}, más de 1 MiB."
hint = "Comprime o reduce el archivo; más de 5 MiB hace fallar la validación."

[finding.conv.file.too-large]
message = "El archivo supera 5 MiB o no se puede leer como archivo regular."
hint = "Saca el archivo del repositorio o redúcelo por debajo de 5 MiB."

[finding.conv.file.encoding]
message = "Codificación inválida: {problem}."
hint = "Guárdalo como UTF-8 sin BOM y con finales de línea LF."

[finding.conv.memory.unexpected-file]
message = "Archivo no permitido en `memory/`."
hint = "En `memory/` solo van `constitution.md`, `decisions/*.md`, `notes/task-<n>.md` y `.gitkeep`."

[finding.conv.memory.note-large]
message = "La nota pesa {size}, 32 KiB o más."
hint = "Resume la nota: el máximo es 64 KiB y cada bloque de sesión, 4000 caracteres."

[finding.conv.gitignore.required]
message = "Falta la línea obligatoria `{entry}`."
hint = "Agrega la línea tal cual, como en la plantilla."

[finding.conv.gitattributes.required]
message = "Falta la línea obligatoria `{entry}`."
hint = "Agrega la línea, como en la plantilla."

[finding.conv.gitattributes.lfs]
message = "Patrón con `filter=lfs`: Git LFS no se usa en esta convención."
hint = "Quita el filtro y saca del repositorio los archivos grandes."

[finding.conv.data.unexpected-file]
message = "Archivo versionado bajo `data/` distinto de `data/README.md`."
hint = "Los datos crudos no se versionan: descríbelos en `data/README.md` y quita el archivo."

[finding.conv.data.index]
message = "Tabla de `data/README.md` inválida: {problem}."
hint = "Usa la tabla con las columnas `id`, `description`, `location`, `access`, `classification` y `version`."

[finding.conv.data.credential-url]
message = "`location` tiene una URL con el parámetro de credencial '{param}'."
hint = "Quita el parámetro o el enlace firmado y explica en `access` cómo pedir acceso."

[finding.conv.provenance.missing]
message = "La salida no tiene entrada en el `provenance.yaml` de su parte."
hint = "Registra en `outputs` su `path`, `kind` y `generator`."

[finding.conv.provenance.invalid]
message = "`provenance.yaml` inválido: {problem}."
hint = "Sigue el formato de `provenance.yaml` de la convención."

[finding.conv.notebook.outputs]
message = "Notebook inválido: {problem}."
hint = "Limpia el notebook con `nbstripout` y déjalo en `analysis/` de su parte."

[finding.conv.convention.value]
message = "`project.yaml` fuera de la convención: {problem}."
hint = "Escribe `convention: \"0.1\"` y usa los valores de `build` de la plantilla."

[finding.conv.agents.structure]
message = "Estructura de `AGENTS.md` inválida: {problem}."
hint = "Conserva el título y las siete secciones numeradas de la plantilla, con 8 KiB y 150 líneas como máximo."

[finding.conv.agents.import]
message = "Importación no permitida @{target}."
hint = "La única importación admitida en `AGENTS.md` es `@memory/constitution.md`."

[finding.conv.agents.modified]
message = "La sección {number} difiere del render de la convención."
hint = "Las secciones 1 a 6 no se editan; las reglas propias van en la sección 7."

[finding.conv.claude.content]
message = "Contenido de `CLAUDE.md` inválido: {problem}."
hint = "`CLAUDE.md` empieza con `@AGENTS.md`, no importa nada más y pesa 1 KiB como máximo."

[finding.conv.constitution.structure]
message = "`memory/constitution.md` inválido: {problem}."
hint = "Conserva las siete secciones de la plantilla, con 8 KiB y 150 líneas como máximo."

[finding.conv.latexmkrc.noncanonical]
message = "`.latexmkrc` difiere del canónico de la convención para el motor {engine}."
hint = "Reemplázalo por el `.latexmkrc` de la plantilla con el `$pdf_mode` de `build.engine`."

[finding.E_VALIDATION_LICENSE_UNKNOWN]
message = "La licencia '{value}' de `licenses.{category}` no es válida: {problem}."
hint = "Usa un identificador SPDX o un `LicenseRef-*` y agrega su texto en `LICENSES/`."

# -- hallazgos de la regla plan-ids ---------------------------------------------------

[finding.E_VALIDATION_PLAN_SYNTAX]
message = "La línea parece una definición del plan pero no cumple la gramática: {text}"
hint = "Escribe `- RQ-1: ...` sin sangría, con el ID en mayúsculas y sin ceros a la izquierda."

[finding.E_VALIDATION_UNKNOWN_PLAN_ID]
message = "El ID del plan {id} no está definido en `plan.md`."
hint = "Corrige la referencia o define el elemento."

[finding.E_VALIDATION_UNKNOWN_DECISION]
message = "La decisión {id} no existe en `memory/decisions/`."
hint = "Cita una decisión de la base o agrega el registro en el mismo PR."

[finding.E_VALIDATION_PLAN_ID_REMOVED]
message = "El ID {id} de la base ya no está en `plan.md`."
hint = "Un ID no se borra: márcalo con `(retired)` después del ID."

[finding.E_VALIDATION_PLAN_RETIRED_CHANGED]
message = "El ID retirado {id} se reactivó o cambió su texto."
hint = "Un retirado sigue retirado con el mismo texto; solo puede agregarse la decisión si no tenía."

[finding.E_VALIDATION_PLAN_ID_REUSED]
message = "El ID nuevo {id} reutiliza un número; el máximo de su prefijo en la base es {max}."
hint = "Usa un número mayor que {max}."

[finding.W_VALIDATION_PLAN_TEXT_CHANGED]
message = "Cambió el texto del elemento {id} del plan."
hint = "Un cambio de dirección se declara con la tarea y el PR correspondientes."

[finding.W_VALIDATION_PLAN_REF_RETIRED]
message = "Se cita el ID retirado {id}."
hint = "Cita el elemento vigente que lo reemplaza."
