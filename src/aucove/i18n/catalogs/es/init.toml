summary = "Completar lo que init deja de ejemplo: el plan (`plan.md`), las personas y sus partes (`roles.yaml`), la constitución (`memory/constitution.md`), la descripción de los datos (`data/README.md`) y, si hacen falta, las reglas propias para los agentes (sección 7 de `AGENTS.md`). El agente guía esta tarea con preguntas."
done_plan = "`plan.md` tiene el objetivo, las preguntas, las hipótesis, el alcance y los métodos del proyecto."
done_roles = "`roles.yaml` tiene a todas las personas, el dueño de cada parte y, en un grupo, el suplente."
done_data = "`data/README.md` describe los datos crudos y dónde viven."
