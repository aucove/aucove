# Catálogo del área init: lo que escribe `init` en el árbol de trabajo y sus mensajes
# (05-operaciones §9.3; 02-convencion REQ-CONV-2). Mismas claves, marcadores y fragmentos
# entre acentos graves que en en/init.toml (REQ-ARCH-72..74).

# Archivos mínimos de una parte que no viene en la plantilla (REQ-CONV-2).
[init.file]
part_tex = '''
% Parte «{id}» (clase section): la edita solo su dueño, declarado en roles.yaml.
% Escribe una oración por línea y separa los párrafos con una línea en blanco (02-convencion §4.3).
% El título de la sección y su etiqueta están en su archivo de enlace de tex/outline/, del editor del artículo:
% aquí no van \section ni \chapter; usa \subsection y niveles menores (02-convencion REQ-CONV-94).
'''
outline = '''
% Archivo de enlace de la sección «{title}» del artículo (clase editor; 02-convencion §4.1.1).
% Lo escribe el editor del artículo: el título, la entrada, el orden de las partes y las transiciones.
% Si la sección se divide en subpartes, agrega un \input por cada una, cada uno solo en su línea.
'''

# Resumen de la fase 2 (05 §10): qué hará init y sobre qué.
[init.summary]
head = "init configurará {repo} (perfil {profile}):"
config = "- Proyecto: idioma {language}, formato {format}, apertura {disclosure}, modo {mode}."
roles = "- roles.yaml: quedas ({lead}) como responsable, única persona y dueño de todas las partes; agrega a tu equipo después."
files = "- Archivos: {created} nuevos, {updated} cambiados y {deleted} borrados; {where}."
where_push = "se suben a `{base}` en un commit"
where_pending = "la base ya está protegida: quedan en tu árbol de trabajo para entregarlos desde una tarea"
no_files = "- Archivos: no cambia ninguno."
kept = "- Se dejan como están porque ya tenían cambios: {paths}."
settings = "- GitHub: ajustes del repositorio (solo squash, con el título y el cuerpo del PR), Actions, colaboradores y etiquetas."
rulesets = "- Protecciones: los rulesets de la base, de las ramas de tarea y de los workflows, y su verificación."
no_rulesets = "- Perfil advisory: la forja no permite exigir reglas; no habrá protecciones que bloqueen."
token = "Después te pediré un token de administración de GitHub de vida corta; no se muestra ni se guarda."
setup_task = "- Tarea de preparación: crea y acepta «{title}», tuya y con todas las partes, para completar con el agente el plan, las personas y las partes."
fresh = "- Carpeta: {path} está vacía; init crea ahí el proyecto y su repositorio de git, con la rama `{base}` y `origin` en {url}."

# Perfil advisory: las garantías que se pierden y la frase de aceptación (06-permisos §5, REQ-PERM-40).
[init.advisory]
table = '''
Perfil advisory: GitHub no permite exigir reglas en este repositorio (Free y privado). Con este perfil:
- quien tenga escritura, o su agente, puede empujar directo a la base o editar en la web;
- un PR se puede integrar sin aprobación, también sin la del editor del artículo;
- los checks corren y se ven en rojo, pero no bloquean;
- nada impide el force push ni el borrado de la base.
Se mantienen: solo squash y sin auto-merge, Actions no aprueba PR, las capas locales y la auditoría, que marca con flag:bypass cada integración sin revisión.
'''
phrase = "acepto el perfil advisory"

[init.bypass]
text = "No hay suplente en roles.yaml: tus PR no tienen quién los apruebe. Si confirmas, quedarás ({login}) como actor de bypass del ruleset de la base, solo para PR, y la auditoría marcará con flag:bypass cada integración sin aprobación. Si no, tus PR quedarán bloqueados hasta que declares un suplente."

