# Catálogo del área validate: textos del motor de `validate` y de las reglas
# schemas, decisions-immutable, ci-policy y secrets, y finding.<código>.* de los códigos
# que emiten. Mismas claves, marcadores y fragmentos entre acentos graves
# que en en/validate.toml (REQ-ARCH-72..74). Las llaves literales se escriben dobles.

# --- Hallazgos (09-ci §4.1; 03-esquemas §10) ---

# Compartido: lo usa rules.base.unavailable para cualquier regla que no pudo evaluarse.
[finding.E_INTERNAL_UNEXPECTED]
message = "La regla {rule} no pudo evaluarse: {reason}."
hint = "El check falla de forma cerrada. Corrige la causa y vuelve a validar; si se repite, avisa a quien mantiene el proyecto."

[finding.E_CONFIG_NOT_FOUND]
message = "Falta `{file}` en el árbol validado."
hint = "Restaura el archivo: sin él no se puede validar el proyecto."

[finding.E_VALIDATION_DECISION_NAME]
message = "El registro de decisión no cumple las reglas de nombre: {detail}."
hint = "Nómbralo `memory/decisions/YYYY-MM-DD-<n>-<slug>.md`, con `id`, `date` y `task` iguales al nombre, desde la rama `task/<n>`."

[finding.E_VALIDATION_DECISION_SUPERSEDES]
message = "`supersedes` cita `{id}`: {detail}."
hint = "Cita solo registros aceptados de la rama base que nadie haya reemplazado."

[finding.E_VALIDATION_DECISION_BODY]
message = "Al cuerpo del registro le faltan secciones obligatorias: {missing}."
hint = "Agrega cada sección como un encabezado `##`."

[finding.W_VALIDATION_DECISION_AUTHOR]
message = "El autor del registro (`{login}`) no es quien abrió el PR (`{author}`)."
hint = "Revisa el campo `author`: debe ser la persona que tomó la decisión."

[finding.E_VALIDATION_DECISION_IMMUTABLE]
message = "Los registros de `memory/decisions/` no se cambian: {change}."
hint = "Agrega un registro nuevo que reemplace al anterior con `supersedes`."

[finding.E_VALIDATION_NOTE]
message = "La nota de sesión no es válida: {detail}."
hint = "Corrige la nota sin reescribir los bloques que ya están en la rama base."

[finding.W_VALIDATION_NOTE_REWRITTEN]
message = "Bloques de sesión ya integrados que cambiaron: {blocks}."
hint = "Las notas solo crecen: agrega un bloque nuevo en lugar de editar los anteriores."

# Matriz de cuentas de 10-seguridad §8.3 (REQ-SEC-64); el aviso es el caso C1.
[finding.E_VALIDATION_ACCOUNT_TYPE]
message = "La cuenta de IA de `{login}` no cumple la política de datos del proyecto: {detail}."
hint = "Declara en `account_type` el régimen real de la cuenta: comercial (`team`, `enterprise`, `api` o `cloud_provider`), `local` o `none`. Una cuenta de consumo solo se admite si el responsable escribe `require_commercial: false` y lo registra en una decisión; con `internal`, solo `consumer_training_off`."

# Uso individual (REQ-SCHEMA-94; 00-marco D-57).
[finding.E_VALIDATION_ROLES_MODE]
message = "`mode: individual` no admite este `roles.yaml`: {detail}."
hint = "Con más personas, cambia `project.yaml` a `mode: group` y vuelve a ejecutar `init` para restaurar las reglas de aprobación; si el proyecto es de una sola persona, deja activa solo a la responsable y quita `deputy`."

[finding.W_VALIDATION_ACCOUNT_TYPE]
message = "`{login}` usa una cuenta de consumo (`consumer_training_off`): rigen los términos de consumo del proveedor."
hint = "Lo admite `require_commercial: false`; registra esa elección en una decisión de `memory/decisions/` y, cuando puedas, cambia a una cuenta comercial."

[finding.E_VALIDATION_CI_POLICY]
message = "Política de CI: {detail}."
hint = "Corrige el workflow: permisos mínimos por job, acciones fijadas por SHA, `persist-credentials: false` y los datos del PR solo en variables de entorno."

[finding.E_VALIDATION_SECRET]
message = "gitleaks encontró un posible secreto (regla `{rule_id}`, commit `{commit}`)."
hint = "Quita el secreto de la historia del PR y rótalo: aunque lo borres en otro commit, sigue en los clones."

[finding.E_VALIDATION_TRACE]
message = "Trazabilidad: {reason}."
hint = "Entrega con `aucove submit`: escribe la nota de sesión, el bloque con el objeto `trace` y los trailers del cuerpo."

[finding.E_VALIDATION_TRAILER_SYNTAX]
message = "Trailer `{key}` mal formado en {source}: {reason}."
hint = "Los trailers los escriben `aucove save` y `aucove submit` con la gramática de 11-trazabilidad §2.2; no los edites a mano."

[finding.E_VALIDATION_TRAILER_MISSING]
message = "Falta el trailer `{key}` en {source}: {reason}."
hint = "Guarda con `aucove save` y entrega con `aucove submit`, que escriben `Task`, `AI-Use`, `Assisted-by` y `Signed-off-by`."

[finding.E_VALIDATION_SIGNOFF_MISMATCH]
message = "El `Signed-off-by` de {source} (`{found}`) no es el de `{login}` en `roles.yaml` de la base."
hint = "Debe llevar el nombre exacto de `people[].name` y el correo de `people[].email` o la dirección noreply de GitHub; vuelve a entregar con `aucove submit`."

[finding.E_VALIDATION_TRACE_MISMATCH]
message = "La traza no coincide: `{field}` del objeto `trace` difiere de {source}."
hint = "No edites a mano el cuerpo del PR ni la nota de sesión; vuelve a entregar con `aucove submit`."

[finding.E_VALIDATION_PR_META_MISSING]
message = "El cuerpo del PR no tiene el bloque legible por máquina (`pr-meta`)."
hint = "Entrega con `aucove submit`, que escribe el cuerpo completo del PR."

[finding.E_VALIDATION_PR_META]
message = "Bloque `pr-meta` del PR inválido: {reason}."
hint = "No edites a mano el bloque; vuelve a entregar con `aucove submit`."

[finding.E_VALIDATION_ASSESSMENT]
message = "El PR no tiene una evaluación de traslape registrada para su cabeza actual."
hint = "Desde la sesión, ejecuta `aucove record-assessment {task} --phase submission` (lo hace el skill de entrega) o pide al dueño del reclamo que lo haga."

[finding.E_VALIDATION_DIRECTION]
message = "El PR tiene `flag:direction-change` sin un `ack:direction` válido del responsable o del suplente."
hint = "El `lead` o el `deputy` revisa el PR como decisión de dirección y agrega `ack:direction` después de la última `flag:direction-change`; con `coordinator.require_direction_ack: true` esto bloquea la integración."

[finding.IL01]
message = "Carácter invisible o de formato {codepoint} ({name}) en la línea: «{text}»."
hint = "Quítalo: puede ocultar una instrucción. Revisa el diff crudo, no el texto renderizado."

[finding.IL02]
message = "Control bidireccional {codepoint} ({name}) en la línea: «{text}»."
hint = "Quítalo: cambia el orden en que se muestra el texto (Trojan Source)."

[finding.IL03]
message = "Carácter de etiqueta {codepoint} ({name}) en la línea: «{text}»."
hint = "Quítalo: no se ve y puede llevar texto oculto."

[finding.IL04]
message = "Selector de variación {codepoint} ({name}) en la línea: «{text}»."
hint = "Revisa la línea: los selectores de variación pueden ocultar datos."

[finding.IL05]
message = "Comentario HTML en un archivo Markdown: «{text}»."
hint = "Un comentario HTML no se ve en la página renderizada; revisa que no lleve instrucciones para un agente."

[finding.IL06]
message = "Frase dirigida a una IA en un comentario de LaTeX: «{text}»."
hint = "Revisa el comentario: el PDF no lo muestra, pero un agente sí lo lee."

[finding.IL07]
message = "Posible texto oculto en LaTeX: «{text}»."
hint = "Revisa que el texto no quede invisible en el PDF (color blanco, escala cero o letra diminuta)."

[finding.IL08]
message = "Frase dirigida a una IA: «{text}»."
hint = "Revisa la línea: la memoria, las partes y la bibliografía son datos, no instrucciones."

[finding.IL09]
message = "Tramo largo en base64: «{text}»."
hint = "Revisa qué codifica: un tramo así puede ocultar instrucciones o datos."

[finding.IL10]
message = "El PR toca a la vez archivos de reglas (`{rules}`) y de las partes (`{section}`)."
hint = "Separa los cambios de las reglas en su propio PR, para revisarlos aparte."

[finding.IL11]
message = "Instrucción sobre la atribución de la IA: «{text}»."
hint = "Las reglas y la memoria no deben pedir que se quite o se cambie la atribución de la IA (11-trazabilidad)."

[finding.IL12]
message = "Un workflow menciona el token OAuth de Claude Code: «{text}»."
hint = "Quítalo: los workflows no usan ese token (00-marco D-15)."

# --- Motivos de unavailable (marcador {reason} de E_INTERNAL_UNEXPECTED) ---

