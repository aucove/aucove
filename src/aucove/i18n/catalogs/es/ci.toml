other = "{n} avisos"

# --- ci seal (09-ci §7.4, REQ-CI-50..56; 11-trazabilidad §8). Cada motivo del resumen va con su
# texto y su código entre acentos graves: ci.seal.reason, ci.seal.proof_reason y, de evidence.toml,
# evidence.manifest_error, evidence.skipped y evidence.check.tsa. Las fechas de las pruebas son
# «fecha verificable» (REQ-TRACE-75).

[ci.seal]
arg_kind = "Qué se sella: `submission` (la cabeza de un PR de tarea) o `integration` (un push a la base)."
arg_policy = "Directorio con el `project.yaml` de la política: idioma y rama base."
arg_repo_dir = "Checkout con la historia de git; solo se leen sus objetos y nada de él se ejecuta."
arg_commit = "Commit que se sella (40 dígitos hexadecimales)."
arg_base_sha = "Punta de la rama base del PR; solo con `submission`."
arg_pr = "Número del PR; solo con `submission`."
arg_out = "Directorio donde queda la carpeta del registro, la que sube el artefacto."
arg_summary = "Archivo del resumen del job (`GITHUB_STEP_SUMMARY`)."
submission_args = "`--pr` y `--base-sha` son obligatorios con `--kind submission`."
integration_args = "`--pr` y `--base-sha` solo se usan con `--kind submission`."
summary_failed = "No se pudo escribir el resumen del job: {path}"
done = "{check}: registros={records}, estado `{status}`."

[ci.seal.kind]
submission = "registro de entrega"
integration = "registro de integración"

[ci.seal.title]
submission = "Registro de entrega"
integration = "Registro de integración"

[ci.seal.comment]
line = "**{check}**: {record} del commit `{sha}` (intento {attempt}), `{status}` con {ok} de {total} pruebas. Hora del sellado (reloj del runner): {utc} (UTC), {local} en la hora del centro de México. El JSON de este comentario es el registro; la carpeta completa está en el artefacto `{artifact}`."
line_utc = "**{check}**: {record} del commit `{sha}` (intento {attempt}), `{status}` con {ok} de {total} pruebas. Hora del sellado (reloj del runner): {utc} (UTC). El JSON de este comentario es el registro; la carpeta completa está en el artefacto `{artifact}`."
signed = "Firmado por el proyecto con la llave `{key_id}` (`{key}`): las pruebas sellan la firma."
unsigned = "Sin la firma del proyecto (`{reason}`): {text}"

[ci.seal.summary]
headline = "**{record}** del commit `{sha}` (intento {attempt}): `{status}`, {ok} de {total} pruebas obtenidas."
sealed_at = "Hora del sellado (reloj del runner): {utc} (UTC); {local} (hora del centro de México). La fecha verificable es la de las pruebas."
sealed_at_utc = "Hora del sellado (reloj del runner): {utc} (UTC); la hora del centro de México no está disponible en este equipo. La fecha verificable es la de las pruebas."
no_pr = "Sin PR: el registro queda solo en el artefacto y en este resumen."
pr = "PR #{pr}."
pr_task = "PR #{pr}, de la tarea #{task}."
base_merge_base = "Entradas: el diff desde el merge-base `{base}`, con {commits} y {entries}."
base_sealed = "Entradas: desde `{base}`, el último commit ya sellado, con {commits} y {entries}."
base_empty = "Entradas: desde el árbol vacío, porque no hay un commit sellado antes (primer registro), con {commits} y {entries}."
base_unknown = "Entradas: desde el árbol vacío, porque no se pudo saber qué commit se selló antes, con {commits} y {entries}."
plan_yes = "Sello del plan: sí (el rango toca `plan.md`, `roles.yaml` o `memory/constitution.md`, o es el primer registro)."
plan_no = "Sello del plan: no."
manifest = "Huella SHA-256 de `manifest.json`: `{sha256}`."
artifact = "Artefacto `{artifact}`, con la carpeta `{folder}`."
out_failed = "No se pudo escribir la carpeta del registro: el artefacto `{artifact}` quedará vacío."
skipped = "Fuera del manifiesto ({n}, `{reason}`): {text}"
comment_created = "Comentario `ci:evidence` publicado en el PR #{pr}."
comment_unchanged = "El comentario `ci:evidence` de este intento ya estaba en el PR #{pr}."
comment_failed = "No se pudo comentar en el PR #{pr} (`{kind}`): el registro queda en el artefacto y en este resumen."
comment_no_forge = "Sin acceso a la forja: no se comentó en el PR #{pr}; el registro queda en el artefacto y en este resumen."
proofs = "Pruebas"
table = "| Prueba | Origen | Resultado | Fecha verificable (UTC) | Hora del centro de México |"
proof_ok = "obtenida, con {revocation}"
proof_no_revocation = "obtenida, sin OCSP ni CRL (`{reason}`)"
proof_pending = "obtenida, pendiente de Bitcoin"
proof_error = "no obtenida (`{reason}`): {text}"
skip_not_task = "El PR #{pr} no es de una tarea (su rama no es `task/<n>`): no se sella."
skip_fork = "El PR #{pr} viene de un fork: no se sella."
not_built = "No se pudo armar el registro del commit `{sha}` (`{reason}`): {text}"
signed = "Firma del proyecto: la llave `{key_id}` (`{key}`) firmó `manifest.json`, y las pruebas sellan la firma `manifest.json.sig`."
unsigned = "Sin la firma del proyecto (`{reason}`): {text} El registro se selló igual, porque la fecha va primero; la firma del índice del paquete del hito lo cubre después."

[ci.seal.summary.commits]
one = "1 commit"
other = "{n} commits"

[ci.seal.summary.entries]
