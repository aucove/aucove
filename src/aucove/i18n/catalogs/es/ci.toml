arg_policy = "Directorio con el `project.yaml` de la política (el de la base)."
arg_changed = "Archivo con las rutas cambiadas, una por línea, como las da `git diff --name-only`."
changed_required = "`--changed` es obligatorio con `--mode pr`."
policy_unreadable = "No se puede leer el `project.yaml` de la política: {path}"
policy_invalid = "El `project.yaml` de la política no es válido; no se emite el plan."
changed_unreadable = "No se puede leer la lista de archivos cambiados: {path}"
changed_too_large = "La lista de archivos cambiados es demasiado grande; se compila de todos modos."
no_sha = "No se pudo determinar el commit: `GITHUB_SHA` no es válido o `git rev-parse HEAD` no respondió."
format_none = "Sin manuscrito (`format: none`): no hay nada que compilar."

[ci.pin_plan]
arg_policy = "Checkout de la rama por defecto, que es la política."
arg_tree = "Checkout de la cabeza del PR (solo en PR del mismo repositorio)."
base_unreadable = "No se puede leer el `project.yaml` de la base: {path}"
base_invalid = "El `project.yaml` de la base no es válido."
base_pin_invalid = "La base no tiene una línea `core_pin` válida."
fork = "Sin árbol del PR: las reglas se evalúan con el núcleo de la base."
pr_pin_missing = "El PR no tiene una línea `core_pin` válida: las reglas se evalúan con el núcleo de la base."
same = "El PR no cambia `core_pin`: las reglas se evalúan con el núcleo de la base."
unsatisfied = "El `core_pin` del PR ({pin}) no satisface `core` de la base ({core}): no se instala esa versión."
run = "El PR cambia `core_pin` a {pin}: las reglas que dependen del núcleo se evalúan con esa versión."

[ci.comment]
arg_kind = "Tipo de comentario: `build`, `validate` o `expire-claims`."
arg_pr = "Número del PR (con `build` y `validate`)."
arg_language = "Idioma del comentario (`es` o `en`); por defecto, el de la política."
arg_outcome = "Resultado del paso de compilación, tal como lo da Actions."
arg_pdf_url = "URL del artefacto con el PDF."
arg_diff_url = "URL del artefacto con el PDF de diferencias, si existe."
arg_run_url = "URL de la ejecución del workflow."
arg_report_dir = "Directorio con el `diagnostics.json` descargado."
arg_policy = "Checkout de la base, de donde sale el idioma."
arg_report = "Reporte de `validate` o de `expire-claims` (sobre de resultado)."
arg_summary = "Archivo del resumen del job (`GITHUB_STEP_SUMMARY`)."
arg_skip_reason = "Motivo de la compilación omitida (`skip_reason` de `compile.yml`): `format-none` o `no-changes`."
skip_reason_build_only = "`--skip-reason` solo se admite con `--kind build`."
no_manuscript = "Sin manuscrito: el resultado queda en el resumen del job y no se comenta en el PR."
report_required = "`--report` es obligatorio con `--kind {kind}`."
pr_required = "`--pr` es obligatorio con `--kind {kind}`."
pr_not_allowed = "`--kind {kind}` no es de un PR: no admite `--pr`."
summary_failed = "No se pudo escribir el resumen del job: {path}"
forge_failed = "No se pudo publicar el comentario: {code}."
forge_error = "No se pudo publicar el comentario (error de la forja: {kind})."
no_permission = "El token no puede comentar en el PR (por ejemplo, un PR desde un fork); el resultado queda en el resumen del job."
created = "Comentario creado."
updated = "Comentario actualizado."
unchanged = "El comentario ya estaba al día."
labeled = "Etiqueta agregada al PR: {label}."
unavailable_value = "no disponible"
artifact_note = "Los enlaces a artefactos requieren una sesión en GitHub."
shown = "Se muestran {shown} de {total}."
hint = "Sugerencia: {hint}"

# Resumen de expire-claims (09-ci §6; 05 §9.19): solo el resumen del job, sin comentario en un PR.
[ci.comment.expire]
title = "{check}"
head = "{tasks} evaluadas; un reclamo vence a los {days} días sin actividad."
nothing = "Sin cambios: ningún reclamo se avisó, venció, renovó ni reparó."
unavailable = "Reporte de `expire-claims` no disponible: el veredicto es el del paso anterior."
incomplete = "`expire-claims` no terminó: {code}"
nobody = "sin reclamante"

[ci.comment.expire.tasks]
one = "1 tarea"
other = "{n} tareas"

[ci.comment.expire.list]
warned = "Avisadas"
expired = "Vencidas"
unexpired = "Renovadas (se quitó `state:expired`)"
repaired = "Reparadas"
skipped = "Omitidas"

[ci.comment.expire.action]
assign_owner = "se asignó al dueño"
clear_assignees = "se quitaron los asignados"
remove_stale_expired = "se quitó una `state:expired` sobrante"
close_merged_issue = "se cerró el Issue de un PR integrado"

[ci.comment.expire.reason]
blocked = "`flag:blocked`"
no_owner = "sin dueño"

[ci.comment.severity]
error = "error"
warning = "aviso"

[ci.comment.build]
title = "{check}: {result}"
pdf = "PDF"
diff = "PDF de diferencias con la base"
run = "Ejecución del workflow"
diagnostics = "Diagnósticos"
diagnostics_unavailable = "Diagnóstico no disponible."
no_diagnostics = "Sin diagnósticos."

[ci.comment.build.outcome]
success = "la compilación terminó bien"
failure = "la compilación falló"
