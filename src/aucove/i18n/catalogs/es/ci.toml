# Textos de los subcomandos internos `ci` (09-ci; área ci).
# Los fragmentos entre acentos graves y los marcadores {x} deben ser iguales en en/ci.toml.

[ci]
description = "Subcomandos internos del CI de la plantilla. No emiten el sobre de resultado."
commands = "subcomandos"
unavailable = "`ci {name}`: no disponible en esta versión ({version})."
unknown = "Subcomando desconocido: {name}."
missing = "Falta el subcomando."
usage = "Error de uso: {message}"
internal = "Error interno (traza {trace_id})."

[ci.command]
build-plan = "Plan de compilación de `compile.yml` a partir de la política de la base."
pin-plan = "Decide si el job `pin` instala el `core_pin` del PR."
comment = "Publica o actualiza el comentario único del CI en el PR y escribe el resumen del job."
base-report = "Reporte posterior a la integración en la base."
seal = "Sella la cabeza de un PR de tarea o un push a la base y deja el registro de evidencia."
editor-review = "Decide si el PR tiene la aprobación del editor del artículo y publica el check en su cabeza."
audit = "Audita cómo entró cada commit de un push a la base y marca con `flag:bypass` lo que no cumple la matriz."

[ci.plan]
finding = "{where}: {code}: {message}"
invalid_value = "Valor inválido para `{key}`; no se emite nada."

[ci.build_plan]
