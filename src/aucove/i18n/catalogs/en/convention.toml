# Rule convention (conv.* of 02-convencion §12) and rule plan-ids (03-esquemas §5).
# Area convention (D-32 f): keys convention.* and finding.<code>.* of the codes emitted by
# ops/rules/convention.py and ops/rules/plan_ids.py. finding.E_VALIDATION_DUPLICATE_ID is in config.toml.

# -- reasons for a rule that could not be evaluated (unavailable) ------------------------

[convention.reason]
no_tree = "there is no tree to validate (PR from a fork or without `--tree`)"
no_roles = "there is no valid `roles.yaml` to resolve the parts"
check_failed = "the {check} check failed unexpectedly"
plan_unreadable = "`plan.md` cannot be read as UTF-8 text of 5 MiB or less"
base_plan_unreadable = "the base `plan.md` cannot be read as UTF-8 text of 5 MiB or less"

