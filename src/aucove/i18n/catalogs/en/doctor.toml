# Catalog of the doctor area: messages and fixes of the doctor checks
# (05-operaciones §9.2; 00-marco D-34 l). Keys doctor.<check>.<status> and their variants.
# Same keys, placeholders and backtick spans as es/doctor.toml (REQ-ARCH-72..74).

[doctor.common]
skip_no_project = "Not applicable outside a project."
fix_validate = "Run `{name} validate` to see the details."
fix_policy = "Run `git fetch origin`; if it still fails, fix `project.yaml` and `roles.yaml` on the base branch."

[doctor.python]
ok = "Python {version}; the `{name}` launcher is at {launcher}."
fail = "Python {version}: 3.11 or later is required."
warn_launcher = "Python {version}, but the `{name}` launcher is not on the `PATH`: hooks will not be able to run it."
warn_not_exe = "Python {version}, but the `{name}` launcher is not an `.exe`: {launcher}."
warn_relative_path = "Also, the `PATH` has entries that depend on the current directory ({entries}): Claude Code resolves them against the project folder, so it would run a `{name}` placed there instead of the installed one."
fix_python = "Install Python 3.11 or later."
fix_launcher = "Install the core with `uv tool install \"{name}=={pin}\" --constraints requirements-lock.txt`, with the `requirements-lock.txt` of that version's Release; then run `uv tool update-shell` and restart the terminal."
fix_relative_path = "Remove those entries from the `PATH` or replace them with absolute paths, then restart the terminal and Claude Code."
warn_packaged = "Also, the app `{app}` has its own copy of `{name}` {version}: on Windows, whatever is installed from inside a packaged app, such as Claude Desktop, stays in its private storage, and that app uses that copy instead of yours."
fix_packaged = "From a PowerShell opened from the Start menu, outside that app, remove that copy with `Remove-Item -Recurse -Force \"{path}\"`, and install and update `{name}` only from there."

[doctor.git]
ok = "git {version} at {path}."
fail = "git was not found outside the repository."
fail_run = "git did not answer `git --version`."
fix = "Install git and reopen the terminal."

[doctor.project_root]
ok = "Project at {path}."
warn = "You are not inside a project: there is no `project.yaml` with `.git` from here upwards."
fix = "Run `{name} doctor` inside the project repository or use `--root`. For a new project, `{name} init --repo <owner>/<repo> --dry-run` checks your token, the empty repo and git without writing anything."

[doctor.project_yaml]
ok = "`project.yaml` is valid."
fail = "`project.yaml` is not valid; problems found: {n}."
fail_unreadable = "`project.yaml` is not a regular file that can be read."

[doctor.roles_yaml]
ok = "`roles.yaml` is valid: people {people}, parts {sections}."
warn = "`roles.yaml` is valid, with warnings: {n} (people {people}, parts {sections})."
fail = "`roles.yaml` is not valid; problems found: {n}."
fail_missing = "`roles.yaml` is missing or is not a regular file."

[doctor.convention]
ok = "Convention {convention} and core {installed}: compatible."
warn = "Core {installed} satisfies `core`, but `core_pin` pins {pin}."
fail = "Convention {convention} and core {installed}: incompatible."
fail_policy = "The policy of the base branch could not be read (`{reason}`): compatibility is evaluated with its `project.yaml`."
skip = "It cannot be checked without a valid `project.yaml`."

[doctor.remote]
ok = "`origin` points to {repo} and `{ref}` exists."
fail = "There is no `origin` remote."
warn_mismatch = "`origin` ({url}) does not point to {repo}, the repository in `project.yaml`."
warn_ref = "`{ref}` is missing: `git fetch` has not been run yet."
fix_missing = "Add the remote with `git remote add origin <url>`."
fix_mismatch = "Check `git remote -v` against `project.yaml`."
fix_ref = "Run `git fetch origin`."
skip = "It cannot be checked without a valid `project.yaml`."
skip_git = "It cannot be checked without git."

