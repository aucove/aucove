# Tabla de expansión de 02-convencion §2.2 (00-marco D-35 j y D-36; 12-mvp REQ-MVP-4).
#
# Cada ítem entre acentos graves de la columna «Ruta» de 02 §2.2 aparece aquí una sola vez
# (clave spec, escrita igual que en la tabla). tools/gen_template_manifest.py lo comprueba contra
# la spec y produce tests/fixtures/template-manifest.txt y src/aucove/_data/required-paths.json.
#
# - in_template: origen con T en 02 §2.2, o generado por D-35 j (CODEOWNERS y task.yml, que la
#   plantilla trae generados desde su roles.yaml de ejemplo; amendment = "D-35").
# - required: lo exige conv.tree.missing. LICENSES/** no, porque init elige las licencias
#   (11-trazabilidad §7.3); los ítems que no vienen en la plantilla, tampoco, salvo los que solo
#   existen con otro formato (formats).
# - paths: rutas concretas con su hito (columna «Hito» de 12-mvp §1.2). Los workflows van por
#   archivo según 09-ci §2 y las licencias según 11-trazabilidad §7.2. <id> se expande con cada
#   parte de la plantilla (sections_example; 00-marco D-55) en el manifiesto y es {id} en
#   required-paths.json.
# - glob: patrón completo cuando la celda escribe una ruta relativa a la anterior («tables/**»).
# - require_dir: la regla exige la carpeta (per_section_dirs) y no el .gitkeep que la mantiene.
# - milestone del ítem: solo en los que aún no tienen rutas concretas (skills, H4).
# - early: la ruta llegó a la plantilla antes que el resto de su hito, así que ya va en el
#   manifiesto del hito anterior. Se quita cuando milestone pasa a ese hito.
# - formats de una ruta: un subconjunto de los del ítem, para una sola ruta (los workflows del
#   editor del artículo solo existen con format: latex, 09-ci REQ-CI-57).
# - formats: formatos de project.yaml en los que el ítem existe y se exige (D-43; D-36 enmendada);
#   sin la clave, todos. La plantilla publicada es la variante latex (REQ-CONV-1), así que
#   in_template habla de ella; un ítem solo de format: none (in_template = false) está en el render
#   none (01-arquitectura REQ-ARCH-100) y sus rutas van en required-paths.json con su filtro.
#
# 12-mvp §1.2 no asigna hito a README.md, .gitattributes ni data/README.md: se toman de H2, porque
# la plantilla de H2 los trae. «.github/ISSUE_TEMPLATE/**» dice «H2 / H3»: los tres archivos
# ya están en H2.

milestone = "H3"
sections_example = ["introduction", "background", "theory", "methodology", "experiments", "results", "conclusions"]

[[item]]
spec = "README.md"
in_template = true
required = true
paths = [{ path = "README.md", milestone = "H2" }]

