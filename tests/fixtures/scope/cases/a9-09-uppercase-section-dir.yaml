id: a9-09-uppercase-section-dir
description: >
  Variante de mayúsculas: sections/Methods/ no es la sección methods (los ids son en
  minúsculas y CI distingue mayúsculas), así que la ruta cae en la clase lead.
covers: [a9:case-variants]
task: {number: 17, claimant: carla, sections: [methods]}
pr: {author: carla}
changes:
  - status: added
    path: sections/Methods/extra.tex
    content: |
      \subsection{Extra}
      Texto en una carpeta con otra grafía.
expect:
  valid: false
  checks: {scope: fail}
  codes: [E_PERM_LEAD_ONLY_PATH]
  paths: [sections/Methods/extra.tex]
