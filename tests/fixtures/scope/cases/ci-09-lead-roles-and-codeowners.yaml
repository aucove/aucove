id: ci-09-lead-roles-and-codeowners
description: >
  PR del responsable en task/18 que cambia roles.yaml (results pasa a dario) y regenera
  .github/CODEOWNERS y task.yml. Pasa scope porque roles-sync y generated-sync pasan:
  roles-sync compara los generados con el roles.yaml del PR.
covers: [ci-4.2:lead-roles-codeowners]
task: {number: 18, claimant: ana, sections: [introduction]}
pr: {author: ana}
changes:
  - status: modified
    path: roles.yaml
    content: |
      # Fixture compartido: política del ejemplo de 06-permisos §2.1 y §4.6.
      version: 1
      lead: ana
      deputy: bruno
      people:
        - login: ana
          name: "Ana Pérez"
          role: lead
          account_type: team
        - login: bruno
          name: "Bruno Díaz"
          role: researcher
          account_type: team
        - login: carla
          name: "Carla Soto"
          role: researcher
          account_type: team
        - login: dario
          name: "Darío Luna"
          role: researcher
          account_type: unknown
      sections:
        - id: introduction
          title: "Introduction"
          owner: ana
        - id: methods
          title: "Methods"
          owner: carla
        - id: results
          title: "Results"
          owner: dario
  - {status: modified, path: .github/CODEOWNERS, generated: true}
  - {status: modified, path: .github/ISSUE_TEMPLATE/task.yml, generated: true}
checks: [scope, roles-sync, generated-sync]
expect:
  valid: true
  checks: {scope: pass, roles-sync: pass, generated-sync: pass}
